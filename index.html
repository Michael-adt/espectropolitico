<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapeamento Político</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --example-bg: #0f172a;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --error-red: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            margin: 0;
            padding: 12px;
        }

        .container { max-width: 680px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 15px; }
        h1 { color: var(--text-main); font-size: 1.5rem; margin-bottom: 6px; }
        
        .progress-container {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            height: 14px;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 2.5%;
            background: linear-gradient(90deg, var(--primary), #0284c7);
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            font-weight: 600;
        }

        .section-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            text-transform: uppercase;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            margin-bottom: 10px;
        }

        .question-step { display: none; }
        .question-step.active { display: block; }

        .q-header { font-weight: 600; font-size: 1.05rem; margin-bottom: 10px; color: var(--text-main); }
        .q-example {
            font-size: 0.88rem;
            color: var(--text-muted);
            background-color: var(--example-bg);
            padding: 10px;
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }

        .option-item:hover, .option-item.selected {
            background-color: rgba(56, 189, 248, 0.12);
            border-color: var(--primary);
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .option-item label {
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
            width: 100%;
        }

        .error-message {
            display: none;
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px;
            border-radius: 6px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-nav {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-prev {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-prev:hover { background-color: rgba(255, 255, 255, 0.05); color: var(--text-main); }

        .btn-next {
            background-color: var(--primary);
            color: #0f172a;
        }

        .btn-next:hover { background-color: var(--primary-hover); color: #ffffff; }

        #result-section { display: none; }
        .result-title { text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 6px; color: var(--primary); }
        .result-subtitle { text-align: center; font-size: 0.95rem; color: var(--text-muted); margin-bottom: 18px; }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
            margin: 0 auto 20px auto;
            background-color: var(--example-bg);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .share-btn-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-share {
            background-color: var(--accent-green);
            color: #0f172a;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .btn-share:hover { opacity: 0.9; }

        .report-box {
            background-color: var(--example-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 18px;
            margin-top: 15px;
        }

        .report-section-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 6px;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .report-paragraph {
            margin-bottom: 14px;
            font-size: 0.94rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .report-paragraph strong { color: var(--primary); }

        .report-bullet-list {
            margin: 10px 0 16px 0;
            padding-left: 0;
            list-style: none;
        }

        .report-bullet-item {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-main);
        }

        .report-bullet-item::before {
            content: "•";
            position: absolute;
            left: 4px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .report-highlight-box {
            background-color: rgba(56, 189, 248, 0.06);
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 6px;
            margin: 16px 0;
            font-size: 0.93rem;
            line-height: 1.6;
        }

        .report-context-box-positive {
            background-color: rgba(52, 211, 153, 0.08);
            border-left: 4px solid var(--accent-green);
            padding: 14px;
            border-radius: 6px;
            margin: 16px 0;
            color: #a7f3d0;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .report-context-box-negative {
            background-color: rgba(239, 68, 68, 0.08);
            border-left: 4px solid var(--error-red);
            padding: 14px;
            border-radius: 6px;
            margin: 16px 0;
            color: #fca5a5;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .bio-card {
            background-color: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .bio-card-title-pos { font-weight: 700; font-size: 0.98rem; color: var(--accent-green); margin-bottom: 6px; }
        .bio-card-title-neg { font-weight: 700; font-size: 0.98rem; color: var(--error-red); margin-bottom: 6px; }

        .bio-card-text {
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--text-main);
        }

        .glossary-term {
            border-bottom: 1px dashed var(--primary);
            color: var(--primary);
            cursor: help;
            position: relative;
            display: inline-block;
        }

        .compat-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .compat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .compat-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
        .compat-value { font-size: 0.95rem; font-weight: bold; color: var(--primary); }

        details.gabarito-panel {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
        }

        details.gabarito-panel summary {
            cursor: pointer;
            font-weight: 700;
            color: var(--primary);
            outline: none;
        }

        .gabarito-list {
            margin-top: 12px;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .gabarito-item {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Mapeamento Político</h1>
    </header>

    <div id="quizContainer">
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Pergunta 1 de 40</div>

        <form id="quizForm" onsubmit="return false;">
            <div id="questionsWrapper"></div>

            <div class="error-message" id="errorMessage">⚠️ Selecione uma opção para continuar.</div>

            <div class="nav-buttons">
                <button type="button" class="btn-nav btn-prev" id="btnPrev" onclick="mudarPergunta(-1)" style="display: none;">← Anterior</button>
                <button type="button" class="btn-nav btn-next" id="btnNext" onclick="mudarPergunta(1)">Próxima →</button>
            </div>
        </form>
    </div>

    <div id="result-section" class="card">
        <div id="pdfExportArea">
            <div class="result-title" id="profileTitle">Seu Perfil Ideológico</div>
            <div class="result-subtitle" id="profileCoords"></div>
            
            <div class="chart-container">
                <canvas id="compassChart"></canvas>
            </div>

            <div class="report-box" id="reportContent"></div>
        </div>

        <div class="share-btn-container" style="margin-top: 20px;">
            <button class="btn-share" onclick="baixarRelatorioPDF()">📄 Baixar Análise Completa em PDF</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
    const perguntas = [
        { id: 'q1', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: false, texto: '1. Se o preço de algo subir muito (como combustível ou comida), o governo não deve congelar os preços nem interferir.', exemplo: 'Deixar os donos de postos e mercados cobrarem o valor que quiserem, acreditando que a concorrência ajusta os preços.' },
        { id: 'q2', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: true, texto: '2. Serviços como postos de saúde, hospitais e escolas devem ser totalmente públicos e mantidos pelo governo.', exemplo: 'O dinheiro dos impostos deve ir para o SUS e escolas públicas em vez de dar auxílios para empresas privadas do setor.' },
        { id: 'q3', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: true, texto: '3. Quem é muito rico deveria pagar mais impostos para ajudar quem é mais pobre.', exemplo: 'Cobrar um imposto especial sobre heranças milionárias e fortunas para financiar auxílios de renda e moradia.' },
        { id: 'q4', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: false, texto: '4. Empresas do governo (como de energia, água ou combustível) devem ser vendidas para empresários privados.', exemplo: 'Deixar que empresas privadas cuidem da luz, água e combustível por considerar a gestão privada mais eficiente.' },
        { id: 'q5', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: true, texto: '5. A lei deve garantir direitos aos trabalhadores (como férias e 13º), sem permitir que o patrão negocie pagar menos.', exemplo: 'O patrão não pode pagar menos ou tirar o 13º salário, mesmo se o funcionário disser que aceita trabalhar assim.' },
        { id: 'q6', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: false, texto: '6. O governo deve cobrar impostos sobre produtos que vêm de fora do país para proteger as lojas e fábricas locais.', exemplo: 'Taxar compras em sites internacionais de roupas ou eletrônicos para evitar que fiquem mais baratos que os nacionais.' },
        { id: 'q7', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: true, texto: '7. O governo pode se endividar para construir hospitais, escolas e estradas quando a população precisar.', exemplo: 'Permitir que o prefeito ou presidente gaste mais do que arrecadou no ano para fazer obras públicas urgentes.' },
        { id: 'q8', bloco: '1. Dinheiro, Compras e Emprego', eixo: 'X', invertido: false, texto: '8. Quem recebe auxílio do governo deve ter um prazo para o benefício acabar e ser obrigado a estudar ou trabalhar.', exemplo: 'Exigir que o beneficiário comprove matrícula em cursos e busca por emprego para manter o auxílio financeiro.' },

        { id: 'q9', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: false, texto: '9. Valores religiosos e tradicionais de família devem orientar as leis da sociedade.', exemplo: 'Regras de casamento, costumes e livros da escola devem respeitar princípios morais e religiosos da maioria.' },
        { id: 'q10', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: true, texto: '10. Cada pessoa deve ter liberdade total para decidir sobre o seu próprio corpo e sua vida.', exemplo: 'O governo não proibir nem prender quem decide interromper uma gravidez (aborto), fazer eutanásia ou usar maconha.' },
        { id: 'q11', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: true, texto: '11. O governo deve reservar vagas em universidades e empregos públicos para negros, indígenas e alunos de escola pública.', exemplo: 'Garantir cotas em faculdades públicas para ajudar grupos que enfrentaram mais dificuldades históricas.' },
        { id: 'q12', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: false, texto: '12. A escola deve ensinar apenas matérias tradicionais, sem discutir gênero e sexualidade.', exemplo: 'Proibir que professores abordem diversidade sexual ou identidade de gênero com crianças e adolescentes.' },
        { id: 'q13', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: false, texto: '13. Pessoas sem antecedentes criminais devem ter o direito de comprar e ter uma arma para se defender.', exemplo: 'Facilitar para que o cidadão comum possa comprar um revólver para proteger sua casa ou comércio.' },
        { id: 'q14', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: false, texto: '14. Jovens de 16 e 17 anos que cometerem crimes graves devem ser julgados e presos como adultos.', exemplo: 'Mandar um adolescente de 16 anos que cometeu um crime grave diretamente para uma cadeia comum de adultos.' },
        { id: 'q15', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: true, texto: '15. Prédios do governo (como tribunais, câmaras e escolas) não devem ter símbolos de nenhuma religião.', exemplo: 'Tirar crucifixos e bíblias das paredes de repartições públicas para manter a neutralidade do Estado.' },
        { id: 'q16', bloco: '2. Família, Estilo de Vida e Direitos', eixo: 'Y', invertido: true, texto: '16. O Brasil deve facilitar a chegada e a moradia de estrangeiros que estão fugindo de guerras ou crises.', exemplo: 'Garantir documentos, permissão de trabalho e acesso ao SUS rapidamente para imigrantes e refugiados.' },

        { id: 'q17', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: true, texto: '17. Qualquer pessoa deve poder falar o que quiser na internet ou na rua, sem medo de ser presa por suas opiniões.', exemplo: 'Não censurar nem prender pessoas por opiniões polêmicas; responder a ideias ruins com debate e não com punição.' },
        { id: 'q18', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '18. O governo deve mandar apagar publicações na internet que espalhem notícias falsas (fake news).', exemplo: 'Criar leis para que plataformas digitais removam posts e bloqueiem contas que espalhem mentiras graves.' },
        { id: 'q19', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '19. Em momentos de emergência ou doença grave na cidade, o governo pode proibir as pessoas de saírem de casa.', exemplo: 'Permitir que governantes decretem toque de recolher e fechem comércios durante crises sanitárias ou de segurança.' },
        { id: 'q20', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '20. Protestos que bloqueiam ruas, avenidas ou estradas devem ser desocupados imediatamente pela polícia.', exemplo: 'Usar a força policial para liberar avenidas fechadas por manifestantes ou grevistas para garantir o trânsito.' },
        { id: 'q21', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '21. Ninguém tem o direito de ocupar uma fazenda ou prédio abandonado que pertença a outra pessoa.', exemplo: 'Expulsar imediatamente via polícia qualquer grupo que ocupe um terreno ou prédio desocupado do seu dono.' },
        { id: 'q22', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: true, texto: '22. Cada estado do Brasil deveria poder criar suas próprias leis sobre crimes, armas e impostos.', exemplo: 'Cada estado poder decidir sozinho se libera armas ou altera penas criminais sem depender de autorização de Brasília.' },
        { id: 'q23', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '23. Juízes e Tribunais (como o STF) não deveriam poder cancelar leis criadas pelos deputados eleitos.', exemplo: 'Se deputados aprovarem uma lei no Congresso, juízes não deveriam ter autoridade para anular essa decisão.' },
        { id: 'q24', bloco: '3. Internet, Leis e Poder do Governo', eixo: 'Y', invertido: false, texto: '24. A polícia deveria poder olhar mensagens de celular de pessoas investigadas por crimes sem precisar de autorização judicial.', exemplo: 'Acessar mensagens de WhatsApp de suspeitos de crimes graves de forma rápida para evitar tragédias.' },

        { id: 'q25', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: true, texto: '25. Proteger florestas e rios deve ser mais importante do que construir estradas ou abrir novas fazendas.', exemplo: 'Proibir obras ou garimpos se houver qualquer risco de desmatamento da Amazônia ou poluição de rios.' },
        { id: 'q26', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: true, texto: '26. O governo deveria cobrar mais impostos sobre a gasolina para incentivar o uso de transporte elétrico ou público.', exemplo: 'Usar o imposto do combustível para financiar ônibus elétricos e energia solar nas cidades.' },
        { id: 'q27', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: true, texto: '27. O Brasil deve cumprir as regras internacionais do clima, mesmo se isso fizer o país produzir ou vender menos.', exemplo: 'Aceitar metas globais para diminuir a emissão de gases, mesmo reduzindo a criação de gado ou termelétricas.' },
        { id: 'q28', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: false, texto: '28. Outros países não têm o direito de exigir regras ambientais para comprar a carne ou a soja produzidas no Brasil.', exemplo: 'Rejeitar exigências de países da Europa que tentem proibir a compra de produtos agrícolas do Brasil.' },
        { id: 'q29', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: true, texto: '29. O dinheiro dos impostos deve ser usado para financiar pesquisas científicas e invenções nas universidades.', exemplo: 'O governo dar bolsas para cientistas brasileiros criarem vacinas, remédios e tecnologia no país.' },
        { id: 'q30', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: false, texto: '30. O Brasil deve negociar vendas de produtos direto com qualquer país, sem depender de autorização do Mercosul.', exemplo: 'Fazer acordos comerciais diretos com os EUA ou China sem precisar de aprovação da Argentina ou Uruguai.' },
        { id: 'q31', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: false, texto: '31. Empresas devem ter permissão para tirar minérios ou fazer plantações em terras indígenas se pagarem lucros à tribo.', exemplo: 'Liberar exploração mineral ou agrícola em terras indígenas mediante compensação financeira direta à comunidade.' },
        { id: 'q32', bloco: '4. Natureza, Tecnologia e Relações Internacionais', eixo: 'X', invertido: true, texto: '32. Empresas ou governos de outros países não deveriam poder comprar grandes extensões de terra no Brasil.', exemplo: 'Proibir por lei que investidores estrangeiros comprem milhares de hectares de fazendas ou florestas no país.' },

            stepDiv.className = `question-step ${index === 0 ? 'active' : ''}`;
            stepDiv.id = `step_${index}`;

            stepDiv.innerHTML = `
                <div class="section-badge">${q.bloco}</div>
                <div class="card">
                    <div class="q-header">${q.texto}</div>

    function selecionarOpcao(qId, val, element) {
        document.getElementById('errorMessage').style.display = 'none';

        const input = document.getElementById(`${qId}_${val}`);
        if (input) input.checked = true;

        const parentGrid = element.closest('.options-grid');
        parentGrid.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
        element.classList.add('selected');

        setTimeout(() => {
            if (perguntaAtualIndex < perguntas.length - 1) {
                mudarPergunta(1);
            }
        }, 220);
    }

    function mudarPergunta(direcao) {
        if (direcao === 1) {
            const qAtual = perguntas[perguntaAtualIndex];
            const respondido = document.querySelector(`input[name="${qAtual.id}"]:checked`);
            
            if (!respondido) {
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }
        }

        document.getElementById('errorMessage').style.display = 'none';

        const passoAtual = document.getElementById(`step_${perguntaAtualIndex}`);
        passoAtual.classList.remove('active');

        perguntaAtualIndex += direcao;

        if (perguntaAtualIndex >= perguntas.length) {
            calcularResultado();
            return;
        }

        const proximoPasso = document.getElementById(`step_${perguntaAtualIndex}`);
        proximoPasso.classList.add('active');

        document.getElementById('btnPrev').style.display = perguntaAtualIndex > 0 ? 'block' : 'none';
        
        if (perguntaAtualIndex === perguntas.length - 1) {
            document.getElementById('btnNext').innerText = 'Ver Diagnóstico Completo →';
        } else {
            document.getElementById('btnNext').innerText = 'Próxima →';
        }

        atualizarBarraProgresso();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function atualizarBarraProgresso() {
        const total = perguntas.length;
        const atual = perguntaAtualIndex + 1;
        const pct = (atual / total) * 100;

        document.getElementById('progressBar').style.width = `${pct}%`;
        document.getElementById('progressText').innerText = `Pergunta ${atual} de ${total} (${Math.round(pct)}%)`;
    }

    function calcularResultado() {
        let scoreX = 0, scoreY = 0;
        let qtdX = 0, qtdY = 0;
        let respostasMap = {};

        perguntas.forEach(q => {
            const el = document.querySelector(`input[name="${q.id}"]:checked`);
            if (el) {
                const val = parseInt(el.value);
                respostasMap[q.id] = val;

                let pontos = 0;
                if (val === 1) pontos = -2;
                else if (val === 2) pontos = -1;
                else if (val === 4) pontos = 1;
                else if (val === 5) pontos = 2;

                if (q.invertido) pontos = -pontos;

                if (q.eixo === 'X') {
                    scoreX += pontos;
                    qtdX++;
                } else {
                    scoreY += pontos;
                    qtdY++;
                }
            }
        });

        const posX = (scoreX / (qtdX * 2)) * 10;
        const posY = (scoreY / (qtdY * 2)) * 10;

        exibirResultado(posX, posY, respostasMap);
    }

    function definirIdeologia(x, y) {
        if (Math.abs(x) <= 2 && Math.abs(y) <= 2) return "Centrismo Pragmático / Moderado";
        if (x < -2 && y > 2) return "Socialismo de Estado / Estatismo Conservador";
        if (x > 2 && y > 2) return "Conservadorismo Tradicional / Direita Conservadora";
        if (x < -2 && y < -2) return "Social-Democracia / Progressismo Social";
        if (x > 2 && y < -2) return "Liberalismo Econômico / Libertarianismo";
        if (x < -2) return "Esquerda Reformista / Social-Desenvolvimentista";
        if (x > 2) return "Direita Fiscal / Liberalismo de Mercado";
        if (y < -2) return "Social-Libertário / Progressista Laico";
        return "Conservadorismo Moderado / Defensor da Ordem";
    }

    function exibirResultado(x, y, respostasMap) {
        document.getElementById('quizContainer').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';

        const nomePerfil = definirIdeologia(x, y);
        document.getElementById('profileTitle').innerText = `Seu Perfil: ${nomePerfil}`;
        document.getElementById('profileCoords').innerText = `Coordenadas: Eixo Econômico (${x > 0 ? '+' : ''}${x.toFixed(1)}) | Eixo Social (${y > 0 ? '+' : ''}${y.toFixed(1)})`;

        document.getElementById('reportContent').innerHTML = gerarRelatorioTextual(x, y, respostasMap);

        const ctx = document.getElementById('compassChart').getContext('2d');
        if (typeof Chart !== 'undefined') {
            compassChartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Sua Posição',
                        data: [{ x: x, y: y }],
                        backgroundColor: '#f43f5e',
                        borderColor: '#ffffff',
                        borderWidth: 2,
                        pointRadius: 9,
                        pointHoverRadius: 12
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            min: -10,
                            max: 10,
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: '← Esquerda Econômica | Direita Econômica →', color: '#f8fafc' },
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#38bdf8' : '#334155', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                        },
                        y: {
                            min: -10,
                            max: 10,
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: '← Libertário/Progressista | Conservador/Autoritário →', color: '#f8fafc' },
                            grid: { color: (ctx) => ctx.tick.value === 0 ? '#38bdf8' : '#334155', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } }
                    }
                }
            });
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function baixarRelatorioPDF() {
        const elemento = document.getElementById('pdfExportArea');
        
        // Adiciona classe temporária para formatar o PDF com fundo branco e cores escuras legíveis
        elemento.style.backgroundColor = '#ffffff';
        elemento.style.color = '#1e293b';
        elemento.style.padding = '20px';

        const opcoes = {
            margin:       10,
            filename:     'relatorio-mapeamento-politico.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(elemento).set(opcoes).save().then(() => {
            // Restaura o estilo original da tela após a exportação
            elemento.style.backgroundColor = '';
            elemento.style.color = '';
            elemento.style.padding = '';
        });
    }

    renderizarPassoAPasso();
</script>
